<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aspect Ratio Calculator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
        <div class="container">
        <h1>Aspect Ratio Calculator</h1>
        
        <div class="calculator-content">
            <div class="input-section">
                <div class="input-group">
                    <div class="input-field">
                        <label for="width">Width</label>
                            
    <select id="options" name="options">
    <option value="Pixel">px</option>
    <option value="Feet">ft</option>
    <option value="Meters">m</option>
    <option value="Milimeters">mm</option>
    <option value="Centimeters">cm</option>
    <option value="Inches">in</option>

                        <input type="number" id="width" min="1" step="1" placeholder="Enter width">
                    </div>
                    <div class="input-field">
                        <label for="height">Height</label>
                        
    <select id="options" name="options">
    <option value="Pixel">px</option>
    <option value="Feet">ft</option>
    <option value="Meters">m</option>
    <option value="Milimeters">mm</option>
    <option value="Centimeters">cm</option>
    <option value="Inches">in</option>
                        <input type="number" id="height" min="1" step="1" placeholder="Enter height">
                    </div>
                </div>
                <div class="result">
                    <p>Aspect Ratio: <span id="ratioResult">-</span></p>
                </div>
            </div>

            <div class="preview-section">
                <h2>Preview</h2>
                <div class="preview-container">
                    <div id="preview-box"></div>
                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
